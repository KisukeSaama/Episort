# ---- Conflict resolution (Story 6.4) -----------------------------------
conflict.dialog.subtitle=Every row is decided on its own, and starts on the answer that settles the conflict: the sorted file takes the destination, and on a duplicate the extra copy is the one that goes. Three answers per row — replace, ignore (the file stays where it is), or delete the extra copy. Tick the files you want — or the header box for all of them — to set the same decision on the lot. Nothing is touched here: applying only rebuilds the plan, which you review before running it. Only a deletion removes a file from disk, and only where you asked for it.
