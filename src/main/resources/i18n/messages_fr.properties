# ---- Résolution des conflits (Story 6.4) -------------------------------
conflict.dialog.subtitle=Chaque ligne se décide séparément et démarre sur la réponse qui règle le conflit : le fichier rangé prend la place, et sur un doublon c'est la copie en trop qui part. Trois réponses par ligne — remplacer, ignorer (le fichier reste où il est), ou supprimer la copie en trop. Cochez les fichiers voulus — ou la case d'en-tête pour tous — afin d'appliquer la même décision au lot. Rien n'est modifié ici : appliquer ne fait que reconstruire le plan, que vous revoyez avant de l'exécuter. Seule la suppression retire un fichier du disque, et uniquement là où vous l'avez demandée.
