name: Portable builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: .\gradlew.bat clean build portableArchive --no-daemon
            artifact: episort-windows-x64
            executable: build/portable/distributions/Episort-*-windows-x64.exe
          - name: Linux x64
            os: ubuntu-22.04
            command: ./gradlew clean build portableArchive --no-daemon
            artifact: episort-linux-x64
            executable: build/portable/distributions/Episort-*-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/portable-launcher/go.mod
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify portable application
        run: ${{ matrix.command }}

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.executable }}
            ${{ matrix.executable }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download portable executables
        uses: actions/download-artifact@v8
        with:
          pattern: episort-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Episort $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
